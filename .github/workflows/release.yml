name: Release (vX.Y.Z tag only)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
      is_prerelease: ${{ steps.release_metadata.outputs.is_prerelease }}
      npm_dist_tag: ${{ steps.release_metadata.outputs.npm_dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify tag is on protected main
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          main_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
          expected_tag="v$(node -p "require('./package.json').version")"
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:${main_ref}"
          node scripts/check-release-ref.mjs \
            --tag-ref "$GITHUB_REF" \
            --expected-tag "$expected_tag" \
            --main-ref "$main_ref"
      - run: npm ci
      - run: npm run check:version -- --tag-required
      - run: npm run check
      - name: Select stable or prerelease channel
        id: release_metadata
        run: |
          set -euo pipefail
          node scripts/release-metadata.mjs | tee release-metadata.json
      - name: Pack and smoke the exact release tarball
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tarball="logister-cli-${version}.tgz"
          npm pack
          test -f "$tarball"
          npm run smoke:pack -- "./${tarball}"
      - run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          shasum -a 256 "logister-cli-${version}.tgz" > checksums.txt
          shasum -a 256 contracts/logister-openapi.yaml > contract-checksum.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logister-cli-release
          path: |
            *.tgz
            checksums.txt
            contract-checksum.txt
            release-metadata.json
          if-no-files-found: error

  publish-npm:
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    needs: package
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install trusted-publishing npm
        run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: logister-cli-release
          path: artifacts
      - name: Verify publish channel
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          IS_PRERELEASE: ${{ needs.package.outputs.is_prerelease }}
          NPM_DIST_TAG: ${{ needs.package.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          test -f "artifacts/logister-cli-${RELEASE_VERSION}.tgz"
          if [ "$IS_PRERELEASE" = "true" ] && [ "$NPM_DIST_TAG" != "next" ]; then
            echo "Prereleases must publish to the npm next dist-tag." >&2
            exit 1
          fi
          if [ "$IS_PRERELEASE" = "false" ] && [ "$NPM_DIST_TAG" != "latest" ]; then
            echo "Stable releases must publish to the npm latest dist-tag." >&2
            exit 1
          fi
      - name: Prevent npm channel downgrade
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          NPM_DIST_TAG: ${{ needs.package.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          channel_args=()
          if [ "$NPM_DIST_TAG" = "latest" ]; then
            current_channel="$(npm view logister-cli@latest version)"
            test -n "$current_channel"
          else
            set +e
            current_channel="$(npm view logister-cli@next version 2>npm-channel-error.txt)"
            lookup_status=$?
            set -e
            if [ "$lookup_status" -ne 0 ]; then
              if grep -Eiq 'E404|No match found for version.*next|not in this registry' npm-channel-error.txt; then
                current_channel=""
                channel_args+=(--allow-missing)
              else
                cat npm-channel-error.txt >&2
                exit "$lookup_status"
              fi
            fi
          fi
          node scripts/check-release-channel.mjs \
            --release-version "$RELEASE_VERSION" \
            --current-version "$current_channel" \
            --channel "$NPM_DIST_TAG" \
            "${channel_args[@]}"
      - name: Determine immutable npm release state
        id: npm_state
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          NPM_DIST_TAG: ${{ needs.package.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          node scripts/check-npm-release-state.mjs \
            --version "$RELEASE_VERSION" \
            --tarball "artifacts/logister-cli-${RELEASE_VERSION}.tgz" \
            --checksum-file artifacts/checksums.txt \
            --dist-tag "$NPM_DIST_TAG"
      - name: Publish to npm with trusted publishing
        if: ${{ vars.NPM_AUTH_MODE != 'token' && steps.npm_state.outputs.publish_required == 'true' }}
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          NPM_DIST_TAG: ${{ needs.package.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          node --version
          npm --version
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true
          npm config set registry https://registry.npmjs.org
          npm publish "artifacts/logister-cli-${RELEASE_VERSION}.tgz" \
            --access public \
            --provenance \
            --tag "$NPM_DIST_TAG"
      - name: Publish to npm with token fallback
        if: ${{ vars.NPM_AUTH_MODE == 'token' && steps.npm_state.outputs.publish_required == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          NPM_DIST_TAG: ${{ needs.package.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_AUTH_MODE=token requires an NPM_TOKEN environment secret." >&2
            exit 1
          fi
          node --version
          npm --version
          npm config set registry https://registry.npmjs.org
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish "artifacts/logister-cli-${RELEASE_VERSION}.tgz" \
            --access public \
            --provenance \
            --tag "$NPM_DIST_TAG"
      - name: Verify published npm bytes and dist-tag
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          NPM_DIST_TAG: ${{ needs.package.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if node scripts/check-npm-release-state.mjs \
              --version "$RELEASE_VERSION" \
              --tarball "artifacts/logister-cli-${RELEASE_VERSION}.tgz" \
              --checksum-file artifacts/checksums.txt \
              --dist-tag "$NPM_DIST_TAG" \
              --require-published; then
              exit 0
            fi
            if [ "$attempt" -lt 24 ]; then
              sleep 5
            fi
          done
          echo "npm did not converge to the exact tested logister-cli@${RELEASE_VERSION} tarball and ${NPM_DIST_TAG} dist-tag." >&2
          exit 1

  github-release:
    needs:
      - package
      - publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: logister-cli-release
          path: artifacts
      - name: Build release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/extract-release-notes.mjs --tag "$TAG_NAME" --output release-notes.md
      - name: Create or converge GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.package.outputs.is_prerelease }}
        run: |
          set -euo pipefail

          metadata_flags=()
          channel_flags=()
          expected_latest="true"
          if [ "$IS_PRERELEASE" = "true" ]; then
            metadata_flags+=(--prerelease)
            channel_flags+=(--latest=false)
            expected_latest="false"
          else
            metadata_flags+=(--prerelease=false)
            channel_flags+=(--latest)
          fi

          verify_release_assets() {
            local verify_dir="$1"
            local expected_assets="${verify_dir}/expected-assets.txt"
            local actual_assets="${verify_dir}/actual-assets.txt"
            local downloads="${verify_dir}/downloads"
            mkdir -p "$downloads"

            find artifacts -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort > "$expected_assets"
            test -s "$expected_assets"
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | LC_ALL=C sort > "$actual_assets"
            if ! diff -u "$expected_assets" "$actual_assets"; then
              echo "GitHub Release assets do not exactly match the tested release artifact set." >&2
              return 1
            fi

            while IFS= read -r asset_name; do
              gh release download "$GITHUB_REF_NAME" \
                --dir "$downloads" \
                --pattern "$asset_name" \
                --clobber
              cmp "artifacts/${asset_name}" "${downloads}/${asset_name}"
            done < "$expected_assets"
          }

          verify_public_release() {
            local verify_dir="$1"
            local state
            local is_draft
            local is_prerelease
            local is_latest
            local release_name
            local release_body
            local expected_body
            state="$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,name --jq '[.isDraft, .isPrerelease, .name] | @tsv')"
            IFS=$'\t' read -r is_draft is_prerelease release_name <<< "$state"
            test "$is_draft" = "false"
            test "$is_prerelease" = "$IS_PRERELEASE"
            test "$release_name" = "$GITHUB_REF_NAME"
            release_body="$(gh release view "$GITHUB_REF_NAME" --json body --jq '.body')"
            expected_body="$(cat release-notes.md)"
            test "$release_body" = "$expected_body"
            is_latest="$(gh release list --limit 100 --json tagName,isLatest --jq ".[] | select(.tagName == \"${GITHUB_REF_NAME}\") | .isLatest")"
            test "$is_latest" = "$expected_latest"
            verify_release_assets "$verify_dir"
          }

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag \
              --draft \
              "${metadata_flags[@]}"
          fi

          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
          read -r is_draft is_prerelease <<< "$state"
          verify_dir="$(mktemp -d)"

          if [ "$is_draft" != "true" ]; then
            verify_public_release "$verify_dir"
            exit 0
          fi

          gh release edit "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --draft=true \
            "${metadata_flags[@]}"
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          verify_release_assets "$verify_dir"
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            "${metadata_flags[@]}" \
            "${channel_flags[@]}"
          verify_public_release "$verify_dir"

  update-package-managers:
    if: ${{ vars.UPDATE_PACKAGE_MANAGERS == 'true' && needs.package.outputs.is_prerelease == 'false' }}
    needs:
      - package
      - github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: logister-cli-release
          path: artifacts
      - name: Wait for npm tarball
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 24); do
            published_version="$(npm view "logister-cli@${version}" version 2>/dev/null || true)"
            latest_version="$(npm view logister-cli@latest version 2>/dev/null || true)"
            if [ "$published_version" = "$version" ] && [ "$latest_version" = "$version" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "logister-cli@${version} is not visible as npm latest yet." >&2
          exit 1
      - name: Clone package-manager repositories
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_MANAGER_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PACKAGE_MANAGER_REPO_TOKEN is required to open Homebrew and Scoop update pull requests." >&2
            exit 1
          fi
          gh repo clone taimoorq/homebrew-logister ../homebrew-logister
          gh repo clone taimoorq/scoop-logister ../scoop-logister
      - name: Update package-manager metadata
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test -f "artifacts/logister-cli-${version}.tgz"
          test -f artifacts/checksums.txt
          npm run update:package-managers -- \
            --version "$version" \
            --checksum-file "$GITHUB_WORKSPACE/artifacts/checksums.txt"
      - name: Open package-manager update PRs
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_MANAGER_REPO_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          open_update_pr() {
            local dir="$1"
            local repo="$2"
            local title="Update Logister CLI to ${version}"
            local branch="bot/logister-cli-v${version}"
            cd "$dir"
            if git diff --quiet; then
              echo "No package-manager changes for ${repo}."
              cd - >/dev/null
              return
            fi
            git checkout -B "$branch"
            git add .
            git commit -m "$title"
            git push --force-with-lease origin "$branch"
            if gh pr view "$branch" --repo "$repo" >/dev/null 2>&1; then
              gh pr edit "$branch" --repo "$repo" \
                --title "$title" \
                --body "Updates package-manager metadata for logister-cli ${version}."
            else
              gh pr create --repo "$repo" \
                --base main \
                --head "$branch" \
                --title "$title" \
                --body "Updates package-manager metadata for logister-cli ${version}."
            fi
            cd - >/dev/null
          }

          open_update_pr ../homebrew-logister taimoorq/homebrew-logister
          open_update_pr ../scoop-logister taimoorq/scoop-logister
