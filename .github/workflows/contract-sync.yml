name: Contract Sync

on:
  workflow_dispatch:
    inputs:
      openapi_url:
        description: Commit-pinned OpenAPI YAML URL
        required: true
      openapi_sha256:
        description: Expected lowercase SHA-256
        required: true
      backend_sha:
        description: Full backend commit SHA in the URL
        required: true
  repository_dispatch:
    types:
      - logister-contract-updated

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require contract-sync bot credential
        env:
          GH_TOKEN: ${{ secrets.LOGISTER_CLI_SYNC_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "LOGISTER_CLI_SYNC_BOT_TOKEN is required for contract-sync branches and pull requests." >&2
            echo "Use a fine-grained bot token with Contents: write and Pull requests: write for taimoorq/logister-cli." >&2
            exit 1
          fi

          if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions.push // false')" != "true" ]; then
            echo "LOGISTER_CLI_SYNC_BOT_TOKEN cannot push contract-sync branches to ${GITHUB_REPOSITORY}." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.LOGISTER_CLI_SYNC_BOT_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download contract
        env:
          INPUT_URL: ${{ inputs.openapi_url }}
          INPUT_SHA256: ${{ inputs.openapi_sha256 }}
          INPUT_BACKEND_SHA: ${{ inputs.backend_sha }}
          DISPATCH_URL: ${{ github.event.client_payload.openapi_url }}
          DISPATCH_SHA256: ${{ github.event.client_payload.openapi_sha256 }}
          DISPATCH_BACKEND_SHA: ${{ github.event.client_payload.backend_sha }}
        run: |
          set -euo pipefail
          url="${DISPATCH_URL:-${INPUT_URL}}"
          checksum="${DISPATCH_SHA256:-${INPUT_SHA256}}"
          backend_sha="${DISPATCH_BACKEND_SHA:-${INPUT_BACKEND_SHA}}"
          if ! printf '%s' "${backend_sha}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Backend SHA must be a full immutable commit."
            exit 1
          fi
          expected_url="https://raw.githubusercontent.com/taimoorq/logister/${backend_sha}/docs/openapi.yaml"
          if [ "${url}" != "${expected_url}" ]; then
            echo "Contract URL is not pinned to the declared backend commit."
            exit 1
          fi
          if ! printf '%s' "${checksum}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "Contract checksum is invalid."
            exit 1
          fi
          curl -fsSL "$url" -o /tmp/logister-openapi.yaml
          printf '%s  %s\n' "${checksum}" /tmp/logister-openapi.yaml | sha256sum --check --strict
          echo "CONTRACT_SOURCE=${url}" >> "$GITHUB_ENV"
      - run: node scripts/sync-contract.mjs /tmp/logister-openapi.yaml contracts/logister-openapi.yaml contracts/logister-api.lock "$CONTRACT_SOURCE"
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.LOGISTER_CLI_SYNC_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No contract changes."
            exit 0
          fi
          branch="bot/contract-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bot_login="$(gh api user --jq .login)"
          bot_id="$(gh api user --jq .id)"
          git config user.name "$bot_login"
          git config user.email "${bot_id}+${bot_login}@users.noreply.github.com"
          git checkout -b "$branch"
          git add contracts/logister-openapi.yaml contracts/logister-api.lock
          git commit -m "Sync Logister API contract"
          gh auth setup-git
          git push origin "$branch"
          gh pr create \
            --title "Sync Logister API contract" \
            --body "Updates the CLI contract snapshot from an immutable, checksum-verified Logister API contract. Complete any required runtime, tests, version, and changelog changes in this pull request before merge." \
            --base main \
            --head "$branch"
