name: Reconcile release distributions

on:
  repository_dispatch:
    types:
      - distribution-published
  workflow_dispatch:
    inputs:
      version:
        description: Stable CLI version to reconcile; defaults to npm latest.
        required: false
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read
  statuses: write

concurrency:
  group: distribution-reconcile-${{ github.event.client_payload.version || inputs.version || 'latest' }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Resolve release identity
        id: release
        env:
          REQUESTED_VERSION: ${{ github.event.client_payload.version || inputs.version }}
          CALLBACK_SHA256: ${{ github.event.client_payload.sha256 }}
        run: |
          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            version="$(npm view logister-cli@latest version)"
          fi
          tag="v${version}"
          git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          release_sha="$(git rev-list -n 1 "$tag")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "sha256=$CALLBACK_SHA256" >> "$GITHUB_OUTPUT"
      - name: Reconcile public channels
        id: channels
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--version "${{ steps.release.outputs.version }}" --output distribution-receipt.json)
          if [ -n "${{ steps.release.outputs.sha256 }}" ]; then
            args+=(--sha256 "${{ steps.release.outputs.sha256 }}")
          fi
          node scripts/reconcile-distributions.mjs "${args[@]}"
      - name: Publish reconciliation status
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          VERSION: ${{ steps.release.outputs.version }}
          OUTCOME: ${{ steps.channels.outcome }}
        run: |
          state=success
          description="npm, GitHub, Homebrew, and Scoop verified for ${VERSION}"
          if [ "$OUTCOME" != "success" ]; then
            state=pending
            description="Waiting for every distribution channel for ${VERSION}"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            -f "state=$state" \
            -f context=release/distributions \
            -f "description=$description" \
            -f "target_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$state" = "pending" ] && [ "${{ github.event_name }}" != "repository_dispatch" ]; then
            exit 1
          fi
      - name: Upload verified receipt
        if: steps.channels.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-receipt-${{ steps.release.outputs.version }}
          path: distribution-receipt.json
          if-no-files-found: error
